<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Strength Program</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #050816;
      --bg-alt: #0b1020;
      --accent: #4f46e5;
      --accent-soft: rgba(79, 70, 229, 0.18);
      --text: #f9fafb;
      --muted: #9ca3af;
      --card: #111827;
      --border: #1f2937;
      --radius-xl: 20px;
      --shadow-soft: 0 14px 40px rgba(0,0,0,0.6);
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: radial-gradient(circle at top, #111827 0, #020617 40%, #000 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      padding: 12px 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(30,64,175,0.66));
      box-shadow: 0 10px 30px rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.2);
    }

    .app-title {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #e5e7eb;
    }

    .app-subtitle {
      font-size: 0.88rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(15,23,42,0.8);
      border: 1px solid rgba(148,163,184,0.4);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #e5e7eb;
    }

    .day-selector {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 0 2px;
      scrollbar-width: none;
      margin-top: 4px;
    }

    .day-selector::-webkit-scrollbar { display: none; }

    .day-pill {
      font-size: 0.8rem;
      padding: 8px 12px;
      min-height: 44px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.3);
      background: rgba(15,23,42,0.9);
      color: var(--muted);
      flex: 0 0 auto;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .day-pill span.dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(148,163,184,0.7);
    }

    .day-pill.active {
      border-color: var(--accent);
      background: rgba(79,70,229,0.16);
      color: #e5e7eb;
    }

    .day-pill.active span.dot {
      background: var(--accent);
    }

    .day-pill.gym span.dot {
      background: var(--success);
    }

    .day-pill.mobility span.dot {
      background: var(--accent);
    }

    .phase-chip {
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.4);
      font-size: 0.75rem;
      color: #e5e7eb;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .phase-chip small {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .progress-header {
      font-size: 0.74rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .dots {
      display: inline-flex;
      gap: 3px;
      align-items: center;
    }

    .dot-indicator {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: rgba(51,65,85,0.7);
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .dot-indicator.active {
      background: var(--accent);
      transform: scale(1.12);
    }

    .card-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: stretch;
      margin-top: 2px;
    }

    .exercise-card {
      width: 100%;
      background: radial-gradient(circle at top left, #111827 0, #020617 40%, #020617 100%);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border);
      padding: 14px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.25s ease-out;
      touch-action: pan-y;
      position: relative;
    }

    .exercise-card.done {
      border-color: rgba(34,197,94,0.9);
      box-shadow:
        0 0 0 1px rgba(34,197,94,0.45),
        0 16px 40px rgba(22,163,74,0.4);
    }

    .done-flag {
      position: absolute;
      top: 10px;
      right: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(22,163,74,0.18);
      border: 1px solid rgba(22,163,74,0.65);
      font-size: 0.7rem;
      color: #bbf7d0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .done-flag span {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--success);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .exercise-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      padding-right: 70px; /* room for done flag */
    }

    .exercise-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .exercise-meta {
      text-align: right;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .exercise-meta strong {
      display: block;
      font-size: 0.8rem;
      color: #e5e7eb;
    }

    .sets-hint {
      display: block;
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .gif-wrapper {
      margin-top: 4px;
      border-radius: 16px;
      overflow: hidden;
      background: radial-gradient(circle at top, #1f2937 0, #020617 65%);
      border: 1px solid rgba(55,65,81,0.9);
      position: relative;
      aspect-ratio: 16/10;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    .gif-wrapper img {
      width: 100%;
      height: auto;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .gif-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(15,23,42,0), rgba(15,23,42,0.65));
      pointer-events: none;
    }

    .gif-label {
      position: absolute;
      bottom: 8px;
      left: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(15,23,42,0.82);
      border: 1px solid rgba(148,163,184,0.4);
      font-size: 0.7rem;
      color: #e5e7eb;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .gif-label span {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--success);
      box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.25);
    }

    .gif-attribution {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .gif-attribution a {
      color: #c7d2fe;
      text-decoration: none;
    }

    .gif-attribution a:hover {
      text-decoration: underline;
    }

    .exercise-body {
      font-size: 0.85rem;
      color: #e5e7eb;
      margin-top: 6px;
      line-height: 1.5;
    }

    .swap-note {
      font-size: 0.76rem;
      color: #fcd34d;
      margin-top: 4px;
    }

    .swap-note button {
      background: none;
      border: none;
      padding: 0 4px;
      color: #c7d2fe;
      font-size: 0.76rem;
      text-decoration: underline;
      cursor: pointer;
      min-height: 24px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .tag {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(55,65,81,0.9);
      color: #e5e7eb;
    }

    .alt-toggle {
      width: 100%;
      min-height: 44px;
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,0.4);
      background: rgba(15,23,42,0.9);
      color: #e5e7eb;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .alt-panel {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(2,6,23,0.7);
      overflow: hidden;
    }

    .alt-panel[hidden] { display: none; }

    .alt-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-top: 1px solid rgba(31,41,55,0.8);
    }

    .alt-item:first-child { border-top: none; }

    .alt-thumb {
      width: 56px;
      height: 42px;
      flex: 0 0 auto;
      border-radius: 8px;
      overflow: hidden;
      background: #0b1020;
      border: 1px solid rgba(55,65,81,0.9);
    }

    .alt-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .alt-info {
      flex: 1;
      min-width: 0;
      font-size: 0.8rem;
    }

    .alt-name {
      font-weight: 500;
      color: #e5e7eb;
    }

    .alt-credit {
      font-size: 0.68rem;
      color: var(--muted);
    }

    .alt-credit a {
      color: #c7d2fe;
      text-decoration: none;
    }

    .alt-use {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(129,140,248,0.7);
      background: rgba(79,70,229,0.18);
      color: #e5e7eb;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .alt-use:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .done-row {
      margin-top: 8px;
      display: flex;
      justify-content: flex-start;
    }

    .done-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      user-select: none;
      color: var(--muted);
      min-height: 44px;
    }

    .done-toggle input {
      display: none;
    }

    .done-toggle .checkmark {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      border: 1px solid rgba(148,163,184,0.7);
      background: rgba(15,23,42,0.9);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: all 0.15s ease;
    }

    .done-toggle input:checked + .checkmark {
      border-color: rgba(34,197,94,0.9);
      background: rgba(22,163,74,0.1);
      box-shadow: 0 0 0 1px rgba(34,197,94,0.4);
    }

    .done-toggle input:checked + .checkmark::before {
      content: "✓";
      color: #bbf7d0;
    }

    .done-label-text {
      color: #e5e7eb;
    }

    .bottom-bar {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .nav-buttons {
      display: flex;
      gap: 6px;
      flex: 1;
    }

    button {
      border: none;
      outline: none;
      cursor: pointer;
      font: inherit;
    }

    .btn {
      flex: 1;
      padding: 10px 12px;
      min-height: 44px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid rgba(148,163,184,0.5);
      background: rgba(15,23,42,0.95);
      color: #e5e7eb;
      transition: background 0.15s ease, transform 0.08s ease, box-shadow 0.15s ease;
    }

    .btn span.icon {
      font-size: 1.05rem;
      display: inline-block;
      transform: translateY(1px);
    }

    .btn-primary {
      background: radial-gradient(circle at top left, #4f46e5, #1d4ed8);
      border-color: rgba(129,140,248,0.9);
      box-shadow: 0 10px 25px rgba(37,99,235,0.6);
    }

    .btn:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: none;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: default;
      box-shadow: none;
    }

    .status {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: right;
      flex: 0 0 auto;
    }

    .rest-card {
      margin-top: 8px;
      padding: 16px 14px;
      border-radius: 16px;
      background: radial-gradient(circle at top, #111827 0, #020617 60%);
      border: 1px dashed rgba(148,163,184,0.6);
      box-shadow: var(--shadow-soft);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .rest-card h2 {
      margin: 0 0 8px;
      font-size: 1rem;
    }

    .rest-card ul {
      margin: 6px 0 0 20px;
      padding: 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .rest-card .next-up {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #c7d2fe;
    }

    @media (max-width: 380px) {
      header { padding: 10px; }
      .exercise-card { padding: 12px 12px 14px; }
      .app { padding-inline: 10px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="app-title">Strength Program</div>
    <div class="app-subtitle">
      <div>
        <span id="todayLabel"></span>
        <div style="margin-top:2px;font-size:0.8rem;color:#cbd5f5;" id="workoutTitle"></div>
      </div>
      <div class="chip">
        <span id="phaseLabel">Rest / Recovery</span>
      </div>
    </div>
    <div class="day-selector" id="daySelector"></div>
    <div class="progress-header" id="progressSummary"></div>
  </header>

  <div id="contentArea"></div>
</div>

<script>
  // === EXERCISE CATALOG =============================================
  // Single source of truth: name, gif, attribution, form cue, muscle tags.
  // Workouts reference ids + slot data; alternatives are ids in the catalog.

  const PLACEHOLDER_GIF =
    "data:image/svg+xml," + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
        <rect width="640" height="400" fill="#0b1020"/>
        <g fill="none" stroke="#334155" stroke-width="3">
          <circle cx="320" cy="150" r="26"/>
          <path d="M320 176 v70 M320 200 l-42 34 M320 200 l42 34 M320 246 l-34 66 M320 246 l34 66" stroke-linecap="round"/>
        </g>
        <text x="320" y="350" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#64748b">No demo available</text>
      </svg>`
    );

  const EXERCISES = {
    "cat-cow": {
      name: "Cat-Cow",
      gifUrl: "https://cdn.yogajournal.com/wp-content/uploads/2020/01/cat-cow-1.gif?width=600",
      attribution: { label: "Yoga Journal", url: "https://www.yogajournal.com/poses/cat-pose/" },
      notes: "Move slowly between rounding and arching; match the motion to your breath.",
      tags: ["Spine", "Mobility"]
    },
    "bird-dog": {
      name: "Bird Dog",
      gifUrl: "https://spotebi.com/wp-content/uploads/2014/10/bird-dogs-exercise-illustration.gif",
      attribution: { label: "Spotebi", url: "https://www.spotebi.com/exercise-guide/bird-dogs/" },
      notes: "Reach opposite arm and leg long while keeping hips level and back flat.",
      tags: ["Core", "Glutes"]
    },
    "glute-bridge": {
      name: "Glute Bridge",
      gifUrl: "https://www.strengthlog.com/wp-content/uploads/2025/09/glutebridge.gif",
      attribution: { label: "StrengthLog", url: "https://www.strengthlog.com/glute-bridge/" },
      notes: "Drive through your heels and squeeze your glutes at the top without arching your low back.",
      tags: ["Glutes", "Hamstrings"]
    },
    "bodyweight-squat": {
      name: "Bodyweight Squat",
      gifUrl: "https://www.strengthlog.com/wp-content/uploads/2020/02/Air-squat.gif",
      attribution: { label: "StrengthLog", url: "https://www.strengthlog.com/air-squat/" },
      notes: "Sit hips back and down, keep your chest up and knees tracking over your feet.",
      tags: ["Quads", "Glutes"]
    },
    "goblet-squat": {
      name: "Goblet Squat",
      gifUrl: "https://www.strengthlog.com/wp-content/uploads/2020/02/Goblet-squat.gif",
      attribution: { label: "StrengthLog", url: "https://www.strengthlog.com/goblet-squat/" },
      notes: "Hold the dumbbell tall at your chest, squat between your heels, and keep your torso upright.",
      tags: ["Quads", "Glutes", "Core"]
    },
    "db-bench-press": {
      name: "Dumbbell Bench Press",
      gifUrl: "https://www.strengthlog.com/wp-content/uploads/2020/03/Dumbbell-Chest-Press.gif",
      attribution: { label: "StrengthLog", url: "https://www.strengthlog.com/dumbbell-chest-press/" },
      notes: "Keep shoulder blades tucked into the bench and lower the dumbbells under control to chest level.",
      tags: ["Chest", "Triceps", "Shoulders"]
    },
    "db-romanian-deadlift": {
      name: "Dumbbell Romanian Deadlift",
      gifUrl: "https://www.strengthlog.com/wp-content/uploads/2022/09/romanian-deadlift-with-dumbbells.gif",
      attribution: { label: "StrengthLog", url: "https://www.strengthlog.com/dumbbell-romanian-deadlift/" },
      notes: "Soft knees, push hips back, and slide the dumbbells down your thighs with a flat back.",
      tags: ["Hamstrings", "Glutes", "Lower back"]
    },
    "chest-supported-row": {
      name: "Chest-Supported Row",
      gifUrl: "https://www.strengthlog.com/wp-content/uploads/2024/11/chest-supported-dumbbell-row.gif",
      attribution: { label: "StrengthLog", url: "https://www.strengthlog.com/chest-supported-dumbbell-row/" },
      notes: "Let the bench support your chest so your low back stays relaxed; pull elbows toward your hips.",
      tags: ["Back", "Lats", "Biceps"]
    },
    "dead-bug": {
      name: "Dead Bug",
      gifUrl: "https://www.strengthlog.com/wp-content/uploads/2023/01/deadbug.gif",
      attribution: { label: "StrengthLog", url: "https://www.strengthlog.com/dead-bug/" },
      notes: "Press your low back gently into the floor and move opposite arm and leg slowly.",
      tags: ["Core", "Spine-friendly"]
    },
    "leg-press": {
      name: "Leg Press",
      gifUrl: "https://www.strengthlog.com/wp-content/uploads/2025/11/leg-press.gif",
      attribution: { label: "StrengthLog", url: "https://www.strengthlog.com/leg-press/" },
      notes: "Keep your lower back on the pad and lower the sled only as far as your hips stay planted.",
      tags: ["Quads", "Glutes"]
    },
    "lat-pulldown": {
      name: "Lat Pulldown",
      gifUrl: "https://www.strengthlog.com/wp-content/uploads/2020/03/lat-pulldown-with-pronated-grip.gif",
      attribution: { label: "StrengthLog", url: "https://www.strengthlog.com/lat-pulldown/" },
      notes: "Pull the bar to your upper chest and think elbows down, not behind your neck.",
      tags: ["Lats", "Back", "Biceps"]
    },
    "hip-thrust": {
      name: "Hip Thrust",
      gifUrl: "https://www.strengthlog.com/wp-content/uploads/2020/02/Hip-thrust.gif",
      attribution: { label: "StrengthLog", url: "https://www.strengthlog.com/hip-thrust/" },
      notes: "Drive through your heels to full hip extension without over-arching your low back at the top.",
      tags: ["Glutes", "Hamstrings"]
    },
    "seated-db-shoulder-press": {
      name: "Seated Dumbbell Shoulder Press",
      gifUrl: "https://www.strengthlog.com/wp-content/uploads/2020/11/Seated-dumbbell-shoulder-press.gif",
      attribution: { label: "StrengthLog", url: "https://www.strengthlog.com/seated-dumbbell-shoulder-press/" },
      notes: "Sit tall with back support, ribs down, and press the dumbbells up without shrugging.",
      tags: ["Shoulders", "Triceps"]
    },
    "pallof-press": {
      name: "Pallof Press",
      gifUrl: "https://www.strengthlog.com/wp-content/uploads/2025/10/pallof-press.gif",
      attribution: { label: "StrengthLog", url: "https://www.strengthlog.com/pallof-press/" },
      notes: "Stand tall and resist the cable pulling you sideways as you press straight out from your chest.",
      tags: ["Core", "Anti-rotation"]
    },
    "trap-bar-deadlift": {
      name: "Trap Bar Deadlift",
      gifUrl: "https://www.strengthlog.com/wp-content/uploads/2020/03/Trap-Bar-Deadlift-With-High-Handles.gif",
      attribution: { label: "StrengthLog", url: "https://www.strengthlog.com/trap-bar-deadlift/" },
      notes: "Use the high handles, push the floor away, and keep a long neutral spine.",
      tags: ["Glutes", "Quads", "Back"]
    },
    "incline-db-press": {
      name: "Incline Dumbbell Press",
      gifUrl: "https://www.strengthlog.com/wp-content/uploads/2020/03/Dumbbell-Incline-Press.gif",
      attribution: { label: "StrengthLog", url: "https://www.strengthlog.com/dumbbell-incline-press/" },
      notes: "Set the bench low-to-moderate incline and press the dumbbells up and slightly together.",
      tags: ["Chest", "Shoulders", "Triceps"]
    },
    "reverse-lunge": {
      name: "Reverse Lunge",
      gifUrl: "https://www.strengthlog.com/wp-content/uploads/2025/01/reverse-dumbbell-lunge.gif",

  };

  // === PROGRAM CONFIG ===============================================
  // SPEC §4.2 mobility circuit (on Tue/Thu only) + §4.3 workouts
  // (Phase 2 set counts; weeks 1–4 use 2 sets).

  const MOBILITY = [
    { exercise: "cat-cow",           sets: "1", reps: "8–10" },
    { exercise: "bird-dog",          sets: "1", reps: "6 / side" },
    { exercise: "glute-bridge",      sets: "1", reps: "10" },
    { exercise: "bodyweight-squat",  sets: "1", reps: "10" }
  ];

  const WORKOUTS = {
    A: {
      label: "Workout A – Full body",
      slots: [
        { slot: 1, exercise: "goblet-squat",        sets: "3", reps: "8–12",    alternatives: ["leg-press", "box-squat"] },
        { slot: 2, exercise: "db-bench-press",      sets: "3", reps: "8–12",    alternatives: [] },
        { slot: 3, exercise: "db-romanian-deadlift",sets: "3", reps: "8–10",    alternatives: ["hip-thrust", "cable-pull-through", "back-extension-45"] },
        { slot: 4, exercise: "chest-supported-row", sets: "3", reps: "10–12",   alternatives: ["seated-cable-row", "machine-row"] },
        { slot: 5, exercise: "dead-bug",            sets: "2", reps: "8 / side", alternatives: [] }
      ]
    },
    B: {
      label: "Workout B – Full body",
      slots: [
        { slot: 1, exercise: "leg-press",                sets: "3", reps: "10–12",   alternatives: [] },
        { slot: 2, exercise: "lat-pulldown",             sets: "3", reps: "10–12",   alternatives: [] },
        { slot: 3, exercise: "hip-thrust",               sets: "3", reps: "10–12",   alternatives: [] },
        { slot: 4, exercise: "seated-db-shoulder-press", sets: "3", reps: "8–12",    alternatives: ["machine-shoulder-press", "landmine-press"] },
        { slot: 5, exercise: "pallof-press",             sets: "2", reps: "10 / side", alternatives: [] }
      ]
    },
    C: {
      label: "Workout C – Full body",
      slots: [
        { slot: 1, exercise: "trap-bar-deadlift", sets: "3", reps: "6–10",   alternatives: ["bulgarian-split-squat", "leg-press"] },
        { slot: 2, exercise: "incline-db-press",  sets: "3", reps: "8–12",   alternatives: [] },
        { slot: 3, exercise: "reverse-lunge",     sets: "2", reps: "8 / leg", alternatives: ["split-squat", "step-up"] },
        { slot: 4, exercise: "seated-cable-row",  sets: "3", reps: "10–12",  alternatives: [] },
        { slot: 5, exercise: "farmer-carry",      sets: "3", reps: "40 m",   alternatives: ["suitcase-carry"] }
      ]
    }
  };

  const MOBILITY_LABEL = "Mobility – back-friendly";

  // Fixed weekday mapping for this viewer: "A"/"B"/"C" = gym workout,
  // "M" = mobility day, null = pure rest.
  const DAY_PLAN = {
    Monday:    "A",
    Tuesday:   "M",
    Wednesday: "B",
    Thursday:  "M",
    Friday:    "C",
    Saturday:  null,
    Sunday:    null
  };
  const DAY_ORDER = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

  // === STATE & STORAGE ==============================================
  let currentDayName = null;
  let currentSessionKey = null; // "A" | "B" | "C" | "M" | null
  let flatExercises = [];   // { phaseName, phaseKind, exercise (resolved), slot }
  let currentIndex = 0;

  const PROGRESS_KEY = "strengthV01Progress";
  const SWAPS_KEY = "strengthV01Swaps";

  const todayLabelEl = document.getElementById("todayLabel");
  const workoutTitleEl = document.getElementById("workoutTitle");
  const phaseLabelEl = document.getElementById("phaseLabel");
  const daySelectorEl = document.getElementById("daySelector");
  const contentAreaEl = document.getElementById("contentArea");
  const progressSummaryEl = document.getElementById("progressSummary");

  function getTodayName() {
    return new Date().toLocaleDateString(undefined, { weekday: "long" });
  }

  function getTodayKey() {
    return new Date().toISOString().slice(0, 10); // YYYY-MM-DD
  }

  function loadJson(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveJson(key, obj) {
    try {
      localStorage.setItem(key, JSON.stringify(obj));
    } catch (e) {}
  }

  // --- done-state: keyed by date + workout letter + card index ---
  function isExerciseDone(idx) {
    const progress = loadJson(PROGRESS_KEY);
    return !!(progress[getTodayKey()] &&
              progress[getTodayKey()][currentSessionKey] &&
              progress[getTodayKey()][currentSessionKey][idx]);
  }

  function setExerciseDone(idx, isDone) {
    const dateKey = getTodayKey();
    const progress = loadJson(PROGRESS_KEY);
    if (!progress[dateKey]) progress[dateKey] = {};
    if (!progress[dateKey][currentSessionKey]) progress[dateKey][currentSessionKey] = {};
    if (isDone) {
      progress[dateKey][currentSessionKey][idx] = true;
    } else {
      delete progress[dateKey][currentSessionKey][idx];
    }
    saveJson(PROGRESS_KEY, progress);
    updateProgressSummary();
  }

  // --- swaps: keyed by workout letter + slot number ---
  function getSwaps() { return loadJson(SWAPS_KEY); }

  function getSwap(letter, slot) {
    const swaps = getSwaps();
    const id = swaps[`${letter}-${slot}`];
    return id && EXERCISES[id] ? id : null;
  }

  function setSwap(letter, slot, exerciseId) {
    const swaps = getSwaps();
    const key = `${letter}-${slot}`;
    if (exerciseId) {
      swaps[key] = exerciseId;
    } else {
      delete swaps[key];
    }
    saveJson(SWAPS_KEY, swaps);
  }

  function resolveExercise(letter, slotData) {
    const swapId = slotData ? getSwap(letter, slotData.slot) : null;
    return EXERCISES[swapId || slotData.exercise] || EXERCISES[slotData.exercise];
  }

  function computeSessionCompletion() {
    const progress = loadJson(PROGRESS_KEY);
    const map = (progress[getTodayKey()] || {})[currentSessionKey] || {};
    const completedCount = Object.keys(map).filter(k => map[k]).length;
    return { completedCount, total: flatExercises.length };
  }

  // === RENDER HELPERS ===============================================
  function buildMobilityExercises() {
    return MOBILITY.map(w => ({
      phaseName: "Mobility (~5–10 min)",
      phaseKind: "mobility",
      slot: null,
      sets: w.sets,
      reps: w.reps,
      alternatives: [],
      exercise: EXERCISES[w.exercise]
    }));
  }

  function buildGymExercises(letter) {
    const result = [];
    const slots = WORKOUTS[letter].slots;
    slots.forEach((s, i) => {
      const phaseName = i < 2 ? "Superset 1" : i < 4 ? "Superset 2" : "Finisher";
      // partner = the other slot in the same superset (name resolved at render so swaps show)
      const partnerSlot = i < 4 ? slots[i % 2 === 0 ? i + 1 : i - 1] : null;
      result.push({
        phaseName,
        phaseKind: "work",
        slot: s.slot,
        slotData: s,
        sets: s.sets,
        reps: s.reps,
        alternatives: s.alternatives,
        partnerSlot,
        exercise: resolveExercise(letter, s)
      });
    });
    return result;
  }

  function formatTodayLabel(date = new Date()) {
    const options = { weekday: "long", month: "short", day: "numeric" };
    return date.toLocaleDateString(undefined, options);
  }

  function nextGymDay(fromDayName) {
    const start = DAY_ORDER.indexOf(fromDayName);
    for (let i = 1; i <= 7; i++) {
      const name = DAY_ORDER[(start + i) % 7];
      if (WORKOUTS[DAY_PLAN[name]]) return { dayName: name, letter: DAY_PLAN[name] };
    }
    return null;
  }

  function buildDaySelector(activeDay) {
    daySelectorEl.innerHTML = "";
    DAY_ORDER.forEach(dayName => {
      const btn = document.createElement("button");
      const plan = DAY_PLAN[dayName];
      const gym = !!WORKOUTS[plan];
      const mobility = plan === "M";
      btn.className = "day-pill" + (dayName === activeDay ? " active" : "") +
        (gym ? " gym" : "") + (mobility ? " mobility" : "");
      btn.type = "button";
      btn.dataset.day = dayName;
      btn.setAttribute("aria-label", dayName +
        (gym ? ` – Workout ${plan}` : mobility ? " – Mobility" : " – Rest day"));
      btn.innerHTML = `<span class="dot"></span>${dayName.slice(0,3)}`;
      btn.addEventListener("click", () => loadDay(dayName));
      daySelectorEl.appendChild(btn);
    });
  }

  function updatePhaseChip() {
    if (!flatExercises.length) {
      phaseLabelEl.textContent = "Rest / Recovery";
      return;
    }
    phaseLabelEl.textContent = flatExercises[currentIndex].phaseName;
  }

  function renderDots() {
    if (!flatExercises.length) return "";
    return flatExercises
      .map((_, idx) => `<span class="dot-indicator ${idx === currentIndex ? "active" : ""}"></span>`)
      .join("");
  }

  function updateProgressSummary() {
    if (!progressSummaryEl) return;
    if (!flatExercises.length) {
      progressSummaryEl.textContent = "Rest day – no gym session today.";
      return;
    }
    const { completedCount, total } = computeSessionCompletion();
    const sessionLabel = currentSessionKey === "M" ? "Mobility" : `Workout ${currentSessionKey}`;
    progressSummaryEl.innerHTML = `
      <span>${sessionLabel}: ${completedCount}/${total} exercises done</span>
      <span class="dots">${renderDots()}</span>
    `;
  }

  function imgTag(src, alt, cls) {
    const safeSrc = src || PLACEHOLDER_GIF;
    return `<img ${cls ? `class="${cls}"` : ""} src="${safeSrc}" alt="${alt}" loading="lazy" onerror="this.onerror=null;this.src=PLACEHOLDER_GIF;" />`;
  }

  function renderRestCard() {
    const next = nextGymDay(currentDayName);
    const restDiv = document.createElement("div");
    restDiv.className = "rest-card";
    restDiv.innerHTML = `
      <h2>Rest Day – No Gym Today</h2>
      <p>Recovery is part of the program. Good options for today:</p>
      <ul>
        <li>Bollyx dance class</li>
        <li>A longer hike</li>
        <li>8,000–10,000 steps at an easy pace</li>
      </ul>
      ${next ? `<div class="next-up">Next: ${next.dayName} – Workout ${next.letter}</div>` : ""}
    `;
    contentAreaEl.appendChild(restDiv);
  }

  function renderAlternativesPanel(item, currentId) {
    const originalId = item.slotData.exercise;
    const currentIsOriginal = currentId === originalId;
    // List alternatives; when swapped, also list the original to switch back.
    const ids = currentIsOriginal
      ? item.alternatives
      : [originalId, ...item.alternatives];

    return ids.map(id => {
      const ex = EXERCISES[id];
      const isCurrent = id === currentId;
      const credit = ex.attribution && ex.attribution.url
        ? `<a href="${ex.attribution.url}" target="_blank" rel="noopener noreferrer">${ex.attribution.label}</a>`
        : (ex.attribution && ex.attribution.label) || "";
      return `
        <div class="alt-item">
          <div class="alt-thumb">${imgTag(ex.gifUrl, `${ex.name} thumbnail`)}</div>
          <div class="alt-info">
            <div class="alt-name">${ex.name}</div>
            <div class="alt-credit">${credit}</div>
          </div>
          <button class="alt-use" type="button" data-exercise-id="${id}" ${isCurrent ? "disabled" : ""}>
            ${isCurrent ? "In use" : "Use this"}
          </button>
        </div>`;
    }).join("");
  }

  function renderExerciseOrRestCard() {
    contentAreaEl.innerHTML = "";

    if (!currentSessionKey || !flatExercises.length) {
      renderRestCard();
      updatePhaseChip();
      updateProgressSummary();
      return;
    }

    const item = flatExercises[currentIndex];
    const slotData = item.slotData || null;
    const exercise = slotData ? resolveExercise(currentSessionKey, slotData) : item.exercise;
    const currentId = slotData ? (getSwap(currentSessionKey, slotData.slot) || slotData.exercise) : null;
    const total = flatExercises.length;
    const done = isExerciseDone(currentIndex);
    const swapped = slotData && currentId !== slotData.exercise;

    const supersetNote = item.partnerSlot
      ? ` Alternate with ${resolveExercise(currentSessionKey, item.partnerSlot).name}; rest 60–90 s between rounds.`
      : "";
    const setsHint = item.phaseKind === "work"
      ? `<span class="sets-hint">(2 sets in weeks 1–4)</span>`
      : "";

    const card = document.createElement("div");
    card.className = "exercise-card" + (done ? " done" : "");
    card.setAttribute("data-card", "exercise");
    card.innerHTML = `
      ${done ? `<div class="done-flag"><span></span>Done</div>` : ""}
      <div class="exercise-header">
        <div>
          <div class="exercise-title">${exercise.name}</div>
          <div class="phase-chip">
            ${item.phaseName}
            <small>• #${currentIndex + 1} of ${total}</small>
          </div>
        </div>
        <div class="exercise-meta">
          <strong>${item.sets} × ${item.reps}</strong>
          <span>Sets × Reps</span>
          ${setsHint}
        </div>
      </div>

      <div class="gif-wrapper">
        ${imgTag(exercise.gifUrl, `${exercise.name} demonstration`)}
        <div class="gif-overlay"></div>
        <div class="gif-label"><span></span>Live form reference</div>
      </div>
      ${
        exercise.attribution && exercise.attribution.url
          ? `<div class="gif-attribution">
               Art credit: <a href="${exercise.attribution.url}" target="_blank" rel="noopener noreferrer">${exercise.attribution.label}</a>
             </div>`
          : ""
      }

      <div class="exercise-body">
        ${(exercise.notes || "") + supersetNote}
        ${exercise.tags && exercise.tags.length
          ? `<div class="tags">${exercise.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>`
          : ""}
        ${swapped
          ? `<div class="swap-note">Swapped from ${EXERCISES[slotData.exercise].name} · <button type="button" id="revertBtn">Revert</button></div>`
          : ""}
      </div>

      ${item.alternatives.length
        ? `<button class="alt-toggle" type="button" id="altToggle" aria-expanded="false" aria-controls="altPanel">
             Alternatives (${item.alternatives.length}) <span aria-hidden="true">▾</span>
           </button>
           <div class="alt-panel" id="altPanel" hidden>${renderAlternativesPanel(item, currentId)}</div>`
        : ""}

      <div class="done-row">
        <label class="done-toggle">
          <input type="checkbox" id="doneCheckbox" ${done ? "checked" : ""} />
          <span class="checkmark"></span>
          <span class="done-label-text">Mark this exercise as done</span>
        </label>
      </div>

      <div class="bottom-bar">
        <div class="nav-buttons">
          <button class="btn" id="prevBtn" type="button" aria-label="Previous exercise">
            <span class="icon">⟵</span> Prev
          </button>
          <button class="btn btn-primary" id="nextBtn" type="button" aria-label="Next exercise">
            Next <span class="icon">⟶</span>
          </button>
        </div>
        <div class="status">
          <div class="dots">${renderDots()}</div>
          <div style="margin-top:3px;">Exercise ${currentIndex + 1}/${total}</div>
        </div>
      </div>
    `;

    contentAreaEl.appendChild(card);
    updatePhaseChip();
    updateProgressSummary();
    hookInteractions(card);
  }

  function hookInteractions(card) {
    if (!flatExercises.length) return;

    const prevBtn = card.querySelector("#prevBtn");
    const nextBtn = card.querySelector("#nextBtn");
    const doneCheckbox = card.querySelector("#doneCheckbox");
    const altToggle = card.querySelector("#altToggle");
    const altPanel = card.querySelector("#altPanel");
    const revertBtn = card.querySelector("#revertBtn");

    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === flatExercises.length - 1;

    prevBtn.addEventListener("click", () => goToExercise(currentIndex - 1));
    nextBtn.addEventListener("click", () => goToExercise(currentIndex + 1));

    if (doneCheckbox) {
      doneCheckbox.addEventListener("change", (e) => {
        const isDone = e.target.checked;
        setExerciseDone(currentIndex, isDone);
        if (isDone) {
          card.classList.add("done");
          if (!card.querySelector(".done-flag")) {
            const flag = document.createElement("div");
            flag.className = "done-flag";
            flag.innerHTML = `<span></span>Done`;
            card.appendChild(flag);
          }
        } else {
          card.classList.remove("done");
          const flag = card.querySelector(".done-flag");
          if (flag) flag.remove();
        }
      });
    }

    if (altToggle && altPanel) {
      altToggle.addEventListener("click", () => {
        const opening = altPanel.hidden;
        altPanel.hidden = !opening;
        altToggle.setAttribute("aria-expanded", String(opening));
      });
      altPanel.addEventListener("click", (e) => {
        const btn = e.target.closest(".alt-use");
        if (!btn || btn.disabled) return;
        const item = flatExercises[currentIndex];
        const newId = btn.dataset.exerciseId;
        const original = WORKOUTS[currentSessionKey].slots.find(s => s.slot === item.slot);
        setSwap(currentSessionKey, item.slot,
          newId === original.exercise ? null : newId);
        renderExerciseOrRestCard();
      });
    }

    if (revertBtn) {
      revertBtn.addEventListener("click", () => {
        const item = flatExercises[currentIndex];
        setSwap(currentSessionKey, item.slot, null);
        renderExerciseOrRestCard();
      });
    }

    // Swipe handling
    let touchStartX = 0;
    let touchStartY = 0;
    let isSwiping = false;

    card.addEventListener("touchstart", (e) => {
      if (!e.touches || e.touches.length === 0) return;
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      isSwiping = true;
    }, { passive: true });

    card.addEventListener("touchend", (e) => {
      if (!isSwiping) return;
      isSwiping = false;

      const touch = e.changedTouches[0];
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);

      if (absDx > 40 && absDx > absDy) {
        if (dx < 0 && currentIndex < flatExercises.length - 1) {
          goToExercise(currentIndex + 1);
        } else if (dx > 0 && currentIndex > 0) {
          goToExercise(currentIndex - 1);
        }
      }
    }, { passive: true });
  }

  function goToExercise(idx) {
    if (idx < 0 || idx >= flatExercises.length) return;
    currentIndex = idx;
    renderExerciseOrRestCard();
  }

  function loadDay(dayName) {
    currentDayName = dayName;
    currentSessionKey = DAY_PLAN[dayName] || null;
    currentIndex = 0;

    todayLabelEl.textContent = formatTodayLabel();
    if (WORKOUTS[currentSessionKey]) {
      workoutTitleEl.textContent = WORKOUTS[currentSessionKey].label;
      flatExercises = buildGymExercises(currentSessionKey);
    } else if (currentSessionKey === "M") {
      const next = nextGymDay(dayName);
      workoutTitleEl.textContent = MOBILITY_LABEL +
        (next ? ` · Next: ${next.dayName} – Workout ${next.letter}` : "");
      flatExercises = buildMobilityExercises();
    } else {
      workoutTitleEl.textContent = "Rest / activity day";
      flatExercises = [];
    }

    Array.from(daySelectorEl.querySelectorAll(".day-pill")).forEach(btn => {
      btn.classList.toggle("active", btn.dataset.day === currentDayName);
    });

    renderExerciseOrRestCard();
  }

  // === INIT =========================================================
  (function init() {
    const todayName = getTodayName();
    const startDay = DAY_PLAN.hasOwnProperty(todayName) ? todayName : "Monday";
    todayLabelEl.textContent = formatTodayLabel();
    buildDaySelector(startDay);
    loadDay(startDay);
  })();
</script>
</body>
</html>
