<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Strength Program</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050816" />
  <script>
    // Apply stored/system theme before first paint (no flash).
    (function () {
      var t = "system";
      try { t = localStorage.getItem("strengthTheme") || "system"; } catch (e) {}
      if (t === "system")
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <style>
    /* Theme variables: dark = original v0.1/v0.2 look, light added in v0.2.
       data-theme is set on <html> by the inline head script (no flash). */
    :root {
      --accent: #4f46e5;
      --radius-xl: 20px;
    }

    :root:not([data-theme]),
    :root[data-theme="dark"] {
      --page-bg: radial-gradient(circle at top, #111827 0, #020617 40%, #000 100%);
      --text: #f9fafb;
      --text-soft: #e5e7eb;
      --muted: #9ca3af;
      --border: #1f2937;
      --shadow-soft: 0 14px 40px rgba(0,0,0,0.6);
      --success: #22c55e;
      --header-bg: linear-gradient(135deg, #0f172a, #1e3a8a);
      --header-border: rgba(148,163,184,0.3);
      --header-shadow: 0 10px 30px rgba(15,23,42,0.9);
      --surface: rgba(15,23,42,0.9);
      --surface-border: rgba(148,163,184,0.4);
      --pill-active-bg: rgba(79,70,229,0.16);
      --pill-active-text: #e5e7eb;
      --dot-off: rgba(51,65,85,0.7);
      --dot-pill: rgba(148,163,184,0.7);
      --card-bg: radial-gradient(circle at top left, #111827 0, #020617 40%, #020617 100%);
      --done-border: rgba(34,197,94,0.9);
      --done-shadow: 0 0 0 1px rgba(34,197,94,0.45), 0 16px 40px rgba(22,163,74,0.4);
      --done-flag-bg: rgba(22,163,74,0.18);
      --done-flag-border: rgba(22,163,74,0.65);
      --done-flag-text: #bbf7d0;
      --link: #c7d2fe;
      --swap: #fcd34d;
      --tag-bg: rgba(15,23,42,0.9);
      --tag-border: rgba(55,65,81,0.9);
      --panel-bg: rgba(2,6,23,0.7);
      --item-border: rgba(31,41,55,0.8);
      --thumb-bg: #0b1020;
      --alt-use-border: rgba(129,140,248,0.7);
      --alt-use-bg: rgba(79,70,229,0.18);
      --alt-use-text: #e5e7eb;
      --check-border: rgba(148,163,184,0.7);
      --check-bg: rgba(15,23,42,0.9);
      --check-on-border: rgba(34,197,94,0.9);
      --check-on-bg: rgba(22,163,74,0.1);
      --btn-bg: rgba(15,23,42,0.95);
      --btn-border: rgba(148,163,184,0.5);
      --btn-text: #e5e7eb;
      --bar-bg: rgba(2,6,23,0.92);
      --rest-bg: radial-gradient(circle at top, #111827 0, #020617 60%);
      --rest-border: rgba(148,163,184,0.6);
      --toggle-bg: rgba(15,23,42,0.9);
      --toggle-border: rgba(148,163,184,0.35);
      --round-active-bg: rgba(79,70,229,0.35);
      --round-active-border: rgba(129,140,248,0.8);
      --round-active-text: #e5e7eb;
      --startline: #c7d2fe;
      --ramp: #fbbf24;
      --pairing: #6ee7b7;
      --ss1: #22c55e;
      --ss2: #818cf8;
      --ss3: #fbbf24;
      --opt-text: #67e8f9;
      --opt-border: rgba(34,211,238,0.5);
      --opt-bg: rgba(34,211,238,0.10);
      --opt-active-bg: rgba(34,211,238,0.25);
      --opt-active-border: #22d3ee;
      --opt-badge-bg: rgba(34,211,238,0.2);
      --trx-text: #f0abfc;
      --trx-border: rgba(232,121,249,0.5);
      --trx-bg: rgba(232,121,249,0.10);
      --trx-active-bg: rgba(232,121,249,0.25);
      --trx-active-border: #e879f9;
      --trx-badge-bg: rgba(232,121,249,0.2);
    }

    :root[data-theme="light"] {
      --page-bg: radial-gradient(circle at top, #eef2ff 0, #f8fafc 55%, #f8fafc 100%);
      --text: #0f172a;
      --text-soft: #1e293b;
      --muted: #475569;
      --border: #e2e8f0;
      --shadow-soft: 0 10px 30px rgba(15,23,42,0.12);
      --success: #16a34a;
      --header-bg: linear-gradient(135deg, #e0e7ff, #dbeafe);
      --header-border: #c7d2fe;
      --header-shadow: 0 10px 25px rgba(100,116,139,0.25);
      --surface: #ffffff;
      --surface-border: #cbd5e1;
      --pill-active-bg: rgba(79,70,229,0.12);
      --pill-active-text: #3730a3;
      --dot-off: #cbd5e1;
      --dot-pill: #94a3b8;
      --card-bg: #ffffff;
      --done-border: #16a34a;
      --done-shadow: 0 0 0 1px rgba(22,163,74,0.35), 0 10px 25px rgba(22,163,74,0.15);
      --done-flag-bg: #dcfce7;
      --done-flag-border: #86efac;
      --done-flag-text: #166534;
      --link: #4338ca;
      --swap: #b45309;
      --tag-bg: #f1f5f9;
      --tag-border: #cbd5e1;
      --panel-bg: #f8fafc;
      --item-border: #e2e8f0;
      --thumb-bg: #eef2ff;
      --alt-use-border: #6366f1;
      --alt-use-bg: #e0e7ff;
      --alt-use-text: #312e81;
      --check-border: #94a3b8;
      --check-bg: #ffffff;
      --check-on-border: #16a34a;
      --check-on-bg: #dcfce7;
      --btn-bg: #ffffff;
      --btn-border: #94a3b8;
      --btn-text: #0f172a;
      --bar-bg: rgba(248,250,252,0.92);
      --rest-bg: #ffffff;
      --rest-border: #cbd5e1;
      --toggle-bg: #f1f5f9;
      --toggle-border: #cbd5e1;
      --round-active-bg: #e0e7ff;
      --round-active-border: #6366f1;
      --round-active-text: #312e81;
      --startline: #4338ca;
      --ramp: #b45309;
      --pairing: #047857;
      --ss1: #16a34a;
      --ss2: #6366f1;
      --ss3: #d97706;
      --opt-text: #0e7490;
      --opt-border: #67e8f9;
      --opt-bg: #ecfeff;
      --opt-active-bg: #cffafe;
      --opt-active-border: #0891b2;
      --opt-badge-bg: rgba(8,145,178,0.15);
      --trx-text: #a21caf;
      --trx-border: #f0abfc;
      --trx-bg: #fdf4ff;
      --trx-active-bg: #fae8ff;
      --trx-active-border: #c026d3;
      --trx-badge-bg: rgba(192,38,211,0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: var(--page-bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      padding: 12px 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 16px;
      background: var(--header-bg);
      box-shadow: var(--header-shadow);
      border: 1px solid var(--header-border);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 44px;
    }

    .header-line {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-soft);
    }

    .theme-icon-btn {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      margin-right: -8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: none;
      color: var(--muted);
      border-radius: 999px;
    }

    .theme-icon-btn svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .day-selector {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 0 2px;
      scrollbar-width: none;
      margin-top: 4px;
    }

    .day-selector::-webkit-scrollbar { display: none; }

    .day-pill {
      font-size: 0.8rem;
      padding: 8px 12px;
      min-height: 44px;
      border-radius: 999px;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      color: var(--muted);
      flex: 0 0 auto;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .day-pill span.dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--dot-pill);
    }

    .day-pill.active {
      border-color: var(--accent);
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
    }

    .day-pill.active span.dot {
      background: var(--accent);
    }

    .day-pill.gym span.dot {
      background: var(--success);
    }

    .day-pill.mobility span.dot {
      background: var(--accent);
    }

    .phase-chip {
      white-space: nowrap;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      font-size: 0.75rem;
      color: var(--text-soft);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dots {
      display: inline-flex;
      gap: 3px;
      align-items: center;
    }

    .dot-indicator {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--dot-off);
      transition: transform 0.18s ease, background 0.18s ease;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .dot-indicator.active {
      background: var(--accent);
      transform: scale(1.12);
    }

    .track {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      align-items: flex-start;
      padding: 0 16px 76px; /* bottom pad: room for the sticky bar over tall cards */
      margin: 0 -2px;
      position: relative;
      touch-action: pan-x pan-y;
    }

    .track::-webkit-scrollbar { display: none; }

    .track .exercise-card {
      flex: 0 0 calc(100% - 32px);
      width: auto;
      scroll-snap-align: center;
      scroll-snap-stop: always;
      animation: none;
    }

    /* superset color coding on the card's left edge */
    .track .exercise-card.ss1 { border-left: 3px solid var(--ss1); }
    .track .exercise-card.ss2 { border-left: 3px solid var(--ss2); }
    .track .exercise-card.ss3 { border-left: 3px solid var(--ss3); }

    .alt-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .alt-toggle {
      min-height: 44px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .alt-toggle.opt {
      color: var(--opt-text);
      border: 1px solid var(--opt-border);
      background: var(--opt-bg);
    }

    .alt-toggle.opt.active {
      border-color: var(--opt-active-border);
      background: var(--opt-active-bg);
    }

    .alt-toggle.opt .alt-badge {
      background: var(--opt-badge-bg);
      color: var(--opt-text);
    }

    .alt-toggle.trx {
      color: var(--trx-text);
      border: 1px solid var(--trx-border);
      background: var(--trx-bg);
    }

    .alt-toggle.trx.active {
      border-color: var(--trx-active-border);
      background: var(--trx-active-bg);
    }

    .alt-toggle.trx .alt-badge {
      background: var(--trx-badge-bg);
      color: var(--trx-text);
    }

    .alt-badge {
      font-size: 0.68rem;
      padding: 1px 6px;
      border-radius: 999px;
    }

    .card-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: stretch;
      margin-top: 2px;
    }

    .exercise-card {
      width: 100%;
      background: var(--card-bg);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border);
      padding: 14px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.25s ease-out;
      position: relative;
    }

    .exercise-card.done {
      border-color: var(--done-border);
      box-shadow: var(--done-shadow);
    }

    .done-flag {
      position: absolute;
      top: 10px;
      right: 12px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--done-flag-bg);
      border: 1px solid var(--done-flag-border);
      font-size: 0.7rem;
      color: var(--done-flag-text);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .done-flag span {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--success);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .exercise-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      padding-right: 70px; /* room for done flag */
    }

    .exercise-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .exercise-meta {
      text-align: right;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .exercise-meta strong {
      display: block;
      font-size: 0.8rem;
      color: var(--text-soft);
    }

    .sets-hint {
      display: block;
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .gif-wrapper {
      margin-top: 4px;
      border-radius: 16px;
      overflow: hidden;
      background: radial-gradient(circle at top, #1f2937 0, #020617 65%);
      border: 1px solid rgba(55,65,81,0.9);
      position: relative;
      aspect-ratio: 16/10;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    .gif-wrapper img {
      width: 100%;
      height: auto;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .gif-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(15,23,42,0), rgba(15,23,42,0.65));
      pointer-events: none;
    }

    .gif-label {
      position: absolute;
      bottom: 8px;
      left: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(15,23,42,0.82);
      border: 1px solid rgba(148,163,184,0.4);
      font-size: 0.7rem;
      color: #e5e7eb;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .gif-label span {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--success);
      box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.25);
    }

    .gif-attribution {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .gif-attribution a {
      color: var(--link);
      text-decoration: none;
    }

    .gif-attribution a:hover {
      text-decoration: underline;
    }

    .exercise-body {
      font-size: 0.85rem;
      color: var(--text-soft);
      margin-top: 6px;
      line-height: 1.5;
    }

    .swap-note {
      font-size: 0.76rem;
      color: var(--swap);
      margin-top: 4px;
    }

    .swap-note button {
      background: none;
      border: none;
      padding: 0 4px;
      color: var(--link);
      font-size: 0.76rem;
      text-decoration: underline;
      cursor: pointer;
      min-height: 24px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .tag {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      color: var(--text-soft);
    }

    .alt-panel {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel-bg);
      overflow: hidden;
    }

    .alt-panel[data-group="alternatives"] { border-top: 2px solid var(--opt-active-border); }
    .alt-panel[data-group="trxAlternatives"] { border-top: 2px solid var(--trx-active-border); }

    .alt-panel[hidden] { display: none; }

    .alt-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-top: 1px solid var(--item-border);
    }

    .alt-item:first-child { border-top: none; }

    .alt-thumb {
      width: 56px;
      height: 42px;
      flex: 0 0 auto;
      border-radius: 8px;
      overflow: hidden;
      background: var(--thumb-bg);
      border: 1px solid var(--tag-border);
    }

    .alt-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .alt-info {
      flex: 1;
      min-width: 0;
      font-size: 0.8rem;
    }

    .alt-name {
      font-weight: 500;
      color: var(--text-soft);
    }

    .alt-credit {
      font-size: 0.68rem;
      color: var(--muted);
    }

    .alt-credit a {
      color: var(--link);
      text-decoration: none;
    }

    .alt-use {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--alt-use-border);
      background: var(--alt-use-bg);
      color: var(--alt-use-text);
      font-size: 0.78rem;
      cursor: pointer;
    }

    .alt-use:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .done-row {
      margin-top: 8px;
      display: flex;
      justify-content: flex-start;
    }

    .done-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      user-select: none;
      color: var(--muted);
      min-height: 44px;
    }

    .done-toggle input {
      display: none;
    }

    .done-toggle .checkmark {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      border: 1px solid var(--check-border);
      background: var(--check-bg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: all 0.15s ease;
    }

    .done-toggle input:checked + .checkmark {
      border-color: var(--check-on-border);
      background: var(--check-on-bg);
      box-shadow: 0 0 0 1px var(--check-on-border);
    }

    .done-toggle input:checked + .checkmark::before {
      content: "\2713";
      color: var(--done-flag-text);
    }

    .done-label-text {
      color: var(--text-soft);
    }

    .bottom-bar {
      margin-top: 10px;
      padding-top: 6px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: sticky;
      bottom: 0;
      z-index: 20;
      background: var(--bar-bg);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .nav-buttons {
      display: flex;
      gap: 6px;
      flex: 1;
    }

    button {
      border: none;
      outline: none;
      cursor: pointer;
      font: inherit;
    }

    .btn {
      flex: 1;
      padding: 10px 12px;
      min-height: 44px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--btn-text);
      transition: background 0.15s ease, transform 0.08s ease, box-shadow 0.15s ease;
    }

    .btn span.icon {
      font-size: 1.05rem;
      display: inline-block;
      transform: translateY(1px);
    }

    .btn-primary {
      background: radial-gradient(circle at top left, #4f46e5, #1d4ed8);
      border-color: rgba(129,140,248,0.9);
      box-shadow: 0 10px 25px rgba(37,99,235,0.6);
      color: #e5e7eb;
    }

    .btn:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: none;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: default;
      box-shadow: none;
    }

    .status {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: right;
      flex: 0 0 auto;
    }

    .rest-card {
      margin-top: 8px;
      padding: 16px 14px;
      border-radius: 16px;
      background: var(--rest-bg);
      border: 1px dashed var(--rest-border);
      box-shadow: var(--shadow-soft);
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .rest-card h2 {
      margin: 0 0 8px;

  // === PROGRAM CONFIG ===============================================
  // SPEC §4.6 sitting recovery routine (on Tue/Thu, 2 rounds) + §4.3
  // workouts (Phase 2 set counts; weeks 1–4 use 2 sets).
  // Alternatives per SPEC §4.5, TRX alternatives per §4.5.1.

  const RECOVERY = [
    { exercise: "hip-flexor-stretch", prescription: "30 s per side" },
    { exercise: "glute-bridge",       prescription: "12 reps" },
    { exercise: "mcgill-curl-up",     prescription: "5 holds × 8–10 s" },
    { exercise: "side-plank",         prescription: "15–20 s per side" },
    { exercise: "bird-dog",           prescription: "5 per side, 8–10 s hold" },
    { exercise: "open-book",          prescription: "5 per side" },
    { exercise: "band-pull-apart",    prescription: "15 reps" },
    { exercise: "dowel-hip-hinge",    prescription: "5 reps" }
  ];

  const WORKOUTS = {
    A: {
      label: "Workout A – Full body",
      slots: [
        { slot: 1, superset: 1, exercise: "goblet-squat",         sets: "3", reps: "8–12",     alternatives: ["leg-press", "box-squat"],            trxAlternatives: ["trx-squat"] },
        { slot: 2, superset: 1, exercise: "db-bench-press",       sets: "3", reps: "8–12",     alternatives: [],                                   trxAlternatives: ["trx-chest-press"] },
        { slot: 3, superset: 2, exercise: "db-romanian-deadlift", sets: "3", reps: "8–10",     alternatives: ["hip-thrust", "cable-pull-through"], trxAlternatives: ["trx-hamstring-curl"] },
        { slot: 4, superset: 2, exercise: "chest-supported-row",  sets: "3", reps: "10–12",    alternatives: ["seated-cable-row", "machine-row"],  trxAlternatives: ["trx-row"] },
        { slot: 5, superset: 3, exercise: "dead-bug",             sets: "2", reps: "8 / side", alternatives: [],                                   trxAlternatives: ["trx-plank"] },
        { slot: 6, superset: 3, exercise: "face-pull",            sets: "2", reps: "12–15",    alternatives: ["reverse-pec-deck", "band-pull-apart"], trxAlternatives: ["trx-face-pull"] }
      ]
    },
    B: {
      label: "Workout B – Full body",
      slots: [
        { slot: 1, superset: 1, exercise: "leg-press",                sets: "3", reps: "10–12",  alternatives: [],                                            trxAlternatives: ["trx-bulgarian-split-squat"] },
        { slot: 2, superset: 1, exercise: "lat-pulldown",             sets: "3", reps: "10–12",  alternatives: [],                                            trxAlternatives: ["trx-high-row"] },
        { slot: 3, superset: 2, exercise: "hip-thrust",               sets: "3", reps: "10–12",  alternatives: [],                                            trxAlternatives: ["trx-hip-thrust"] },
        { slot: 4, superset: 2, exercise: "seated-db-shoulder-press", sets: "3", reps: "8–12",   alternatives: ["machine-shoulder-press", "landmine-press"],  trxAlternatives: [] },
        { slot: 5, superset: 3, exercise: "pushup",                   sets: "3", reps: "10–20",  alternatives: ["machine-chest-press", "pallof-press"],       trxAlternatives: ["trx-chest-press"] },
        { slot: 6, superset: 3, exercise: "back-extension-45",        sets: "2", reps: "10–15",  alternatives: ["machine-back-extension", "bird-dog-weighted-hold"], trxAlternatives: [] }
      ]
    },
    C: {
      label: "Workout C – Full body",
      slots: [
        { slot: 1, superset: 1,    exercise: "trap-bar-deadlift", sets: "3", reps: "6–10",    alternatives: ["bulgarian-split-squat", "leg-press"], trxAlternatives: [] },
        { slot: 2, superset: 1,    exercise: "incline-db-press",  sets: "3", reps: "8–12",    alternatives: [],                                   trxAlternatives: ["trx-chest-press"] },
        { slot: 3, superset: 2,    exercise: "reverse-lunge",     sets: "2", reps: "8 / leg", alternatives: ["split-squat", "step-up"],           trxAlternatives: ["trx-reverse-lunge"] },
        { slot: 4, superset: 2,    exercise: "seated-cable-row",  sets: "3", reps: "10–12",   alternatives: [],                                   trxAlternatives: ["trx-row"] },
        { slot: 5, superset: null, exercise: "farmer-carry",      sets: "3", reps: "40 m",    alternatives: ["suitcase-carry"],                   trxAlternatives: [] }
      ]
    }
  };

  const RECOVERY_LABEL = "Sitting recovery · ~10 min, 2 rounds";

  // Fixed weekday mapping for this viewer: "A"/"B"/"C" = gym workout,
  // "M" = recovery day (session keys "M1"/"M2"), null = pure rest.
  const DAY_PLAN = {
    Monday:    "A",
    Tuesday:   "M",
    Wednesday: "B",
    Thursday:  "M",
    Friday:    "C",
    Saturday:  null,
    Sunday:    null
  };
  const DAY_ORDER = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

  // === STATE & STORAGE ==============================================
  let currentDayName = null;
  let currentSessionKey = null; // "A" | "B" | "C" | "M1" | "M2" | null
  let currentRound = 1;         // recovery day round (1 | 2)
  let flatExercises = [];   // { phaseName, phaseKind, exercise (resolved), slot }
  let currentIndex = 0;

  const PROGRESS_KEY = "strengthV02Progress";
  const SWAPS_KEY = "strengthV01Swaps";

  const headerCompactTextEl = document.getElementById("headerCompactText");
  const daySelectorEl = document.getElementById("daySelector");
  const contentAreaEl = document.getElementById("contentArea");

  function getTodayName() {
    return new Date().toLocaleDateString(undefined, { weekday: "long" });
  }

  function getTodayKey() {
    // Local date (not toISOString — that can roll into the next UTC day)
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function loadJson(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveJson(key, obj) {
    try {
      localStorage.setItem(key, JSON.stringify(obj));
    } catch (e) {}
  }

  // --- done-state: keyed by date + workout letter + card index ---
  function isExerciseDone(idx) {
    const progress = loadJson(PROGRESS_KEY);
    return !!(progress[getTodayKey()] &&
              progress[getTodayKey()][currentSessionKey] &&
              progress[getTodayKey()][currentSessionKey][idx]);
  }

  function setExerciseDone(idx, isDone) {
    const dateKey = getTodayKey();
    const progress = loadJson(PROGRESS_KEY);
    if (!progress[dateKey]) progress[dateKey] = {};
    if (!progress[dateKey][currentSessionKey]) progress[dateKey][currentSessionKey] = {};
    if (isDone) {
      progress[dateKey][currentSessionKey][idx] = true;
    } else {
      delete progress[dateKey][currentSessionKey][idx];
    }
    saveJson(PROGRESS_KEY, progress);
    updateHeaderCompact();
  }

  // --- swaps: keyed by workout letter + slot number ---
  function getSwaps() { return loadJson(SWAPS_KEY); }

  function getSwap(letter, slot) {
    const swaps = getSwaps();
    const id = swaps[`${letter}-${slot}`];
    if (!id || !EXERCISES[id]) return null;
    // Ignore stale swaps: id must be in this slot's current alternative groups
    const slotData = WORKOUTS[letter] && WORKOUTS[letter].slots.find(s => s.slot === slot);
    if (!slotData) return null;
    const valid = slotData.alternatives.concat(slotData.trxAlternatives);
    return valid.includes(id) ? id : null;
  }

  function setSwap(letter, slot, exerciseId) {
    const swaps = getSwaps();
    const key = `${letter}-${slot}`;
    if (exerciseId) {
      swaps[key] = exerciseId;
    } else {
      delete swaps[key];
    }
    saveJson(SWAPS_KEY, swaps);
  }

  function resolveExercise(letter, slotData) {
    const swapId = slotData ? getSwap(letter, slotData.slot) : null;
    return EXERCISES[swapId || slotData.exercise] || EXERCISES[slotData.exercise];
  }

  function computeSessionCompletion() {
    const progress = loadJson(PROGRESS_KEY);
    const map = (progress[getTodayKey()] || {})[currentSessionKey] || {};
    const completedCount = Object.keys(map).filter(k => map[k]).length;
    return { completedCount, total: flatExercises.length };
  }

  // === RENDER HELPERS ===============================================
  function buildRecoveryExercises() {
    return RECOVERY.map(w => ({
      phaseName: `Recovery · Round ${currentRound}`,
      chipText: `Recovery · Round ${currentRound}`,
      ssClass: "",
      phaseKind: "mobility",
      slot: null,
      prescription: w.prescription,
      alternatives: [],
      trxAlternatives: [],
      exercise: EXERCISES[w.exercise]
    }));
  }

  function buildGymExercises(letter) {
    const result = [];
    const slots = WORKOUTS[letter].slots;
    // ramp-up hint goes on the first slot of Supersets 1 and 2 (SPEC §5.5)
    const rampSlots = [1, 2].map(n =>
      slots.find(s => s.superset === n)).map(s => s && s.slot);
    slots.forEach((s) => {
      const phaseName = s.superset ? `Superset ${s.superset}` : "Finisher";
      // partner = the other slot in the same superset (name resolved at render so swaps show)
      const partnerSlot = slots.find(o => o !== s && o.superset === s.superset) || null;
      const ssGroup = s.superset ? slots.filter(o => o.superset === s.superset) : [s];
      result.push({
        phaseName,
        phaseKind: "work",
        ssClass: s.superset ? `ss${s.superset}` : "",
        chipText: s.superset
          ? `Superset ${s.superset} · ${ssGroup.indexOf(s) + 1} of ${ssGroup.length}`
          : "Finisher",
        slot: s.slot,
        slotData: s,
        sets: s.sets,
        alternatives: s.alternatives,
        trxAlternatives: s.trxAlternatives,
        partnerSlot,
        rampSlot: rampSlots.includes(s.slot),
        exercise: resolveExercise(letter, s)
      });
    });
    return result;
  }

  function nextGymDay(fromDayName) {
    const start = DAY_ORDER.indexOf(fromDayName);
    for (let i = 1; i <= 7; i++) {
      const name = DAY_ORDER[(start + i) % 7];
      if (WORKOUTS[DAY_PLAN[name]]) return { dayName: name, letter: DAY_PLAN[name] };
    }
    return null;
  }

  function buildDaySelector(activeDay) {
    daySelectorEl.innerHTML = "";
    DAY_ORDER.forEach(dayName => {
      const btn = document.createElement("button");
      const plan = DAY_PLAN[dayName];
      const gym = !!WORKOUTS[plan];
      const mobility = plan === "M";
      btn.className = "day-pill" + (dayName === activeDay ? " active" : "") +
        (gym ? " gym" : "") + (mobility ? " mobility" : "");
      btn.type = "button";
      btn.dataset.day = dayName;
      btn.setAttribute("aria-label", dayName +
        (gym ? ` – Workout ${plan}` : mobility ? " – Recovery" : " – Rest day"));
      btn.innerHTML = `<span class="dot"></span>${dayName.slice(0,3)}`;
      btn.addEventListener("click", () => loadDay(dayName));
      daySelectorEl.appendChild(btn);
    });
  }

  function renderDots() {
    if (!flatExercises.length) return "";
    return flatExercises
      .map((_, idx) =>
        `<button type="button" class="dot-indicator ${idx === currentIndex ? "active" : ""}" data-idx="${idx}" aria-label="Go to exercise ${idx + 1}"></button>`)
      .join("");
  }

  function sessionShortLabel() {
    if (currentSessionKey === "M1" || currentSessionKey === "M2")
      return `Recovery · Round ${currentRound}`;
    if (WORKOUTS[currentSessionKey]) return `Workout ${currentSessionKey}`;
    return "Rest day";
  }

  function updateHeaderCompact() {
    if (!headerCompactTextEl) return;
    let text = `${currentDayName.slice(0, 3)} · ${sessionShortLabel()}`;
    if (flatExercises.length) {
      const { completedCount, total } = computeSessionCompletion();
      text += ` · ${completedCount}/${total}` +
        (currentSessionKey.startsWith("M") ? "" : " done");
    }
    headerCompactTextEl.textContent = text;
  }

  function imgTag(src, alt, cls) {
    const safeSrc = src || PLACEHOLDER_GIF;
    return `<img ${cls ? `class="${cls}"` : ""} src="${safeSrc}" alt="${alt}" loading="lazy" onerror="this.onerror=null;this.src=PLACEHOLDER_GIF;" />`;
  }

  function renderRestCard() {
    const next = nextGymDay(currentDayName);
    const restDiv = document.createElement("div");
    restDiv.className = "rest-card";
    restDiv.innerHTML = `
      <h2>Rest Day – No Gym Today</h2>
      <p>Recovery is part of the program. Good options for today:</p>
      <ul>
        <li>Bollyx dance class</li>
        <li>A longer hike</li>
        <li>8,000–10,000 steps at an easy pace</li>
      </ul>
      <p>Take at least one full rest day this week (an easy walk is fine).</p>
      ${next ? `<div class="next-up">Next: ${next.dayName} – Workout ${next.letter}</div>` : ""}
    `;
    contentAreaEl.appendChild(restDiv);
  }

  function renderAlternativesPanel(item, currentId, group) {
    const originalId = item.slotData.exercise;
    const groupIds = item[group] || [];
    // When swapped, prepend the original to the group the swap came from
    // so it stays reachable from the list it was swapped from.
    const ids = groupIds.includes(currentId)
      ? [originalId, ...groupIds]
      : groupIds;

    return ids.map(id => {
      const ex = EXERCISES[id];
      const isCurrent = id === currentId;
      const credit = ex.attribution && ex.attribution.url
        ? `<a href="${ex.attribution.url}" target="_blank" rel="noopener noreferrer">${ex.attribution.label}</a>`
        : (ex.attribution && ex.attribution.label) || "";
      return `
        <div class="alt-item">
          <div class="alt-thumb">${imgTag(ex.gifUrl, `${ex.name} thumbnail`)}</div>
          <div class="alt-info">
            <div class="alt-name">${ex.name}</div>
            <div class="alt-credit">${credit}</div>
          </div>
          <button class="alt-use" type="button" data-exercise-id="${id}" ${isCurrent ? "disabled" : ""}>
            ${isCurrent ? "In use" : "Use this"}
          </button>
        </div>`;
    }).join("");
  }

  // === CARD + CAROUSEL ==============================================
  // All cards of the day live in one horizontal scroll-snap track.

  function buildCard(item, idx) {
    const slotData = item.slotData || null;
    const exercise = slotData ? resolveExercise(currentSessionKey, slotData) : item.exercise;
    const currentId = slotData ? (getSwap(currentSessionKey, slotData.slot) || slotData.exercise) : null;
    const done = isExerciseDone(idx);
    const swapped = slotData && currentId !== slotData.exercise;

    const partner = slotData && item.partnerSlot
      ? resolveExercise(currentSessionKey, item.partnerSlot)
      : null;
    const supersetNote = partner
      ? ` Alternate with ${partner.name}; rest 60–90 s between rounds.`
      : "";
    // SPEC §4.5.1: tip when both exercises in a superset resolved to TRX
    const trxPairTip = partner && exercise.type === "suspension" && partner.type === "suspension"
      ? `<div class="pairing-tip">Both use the TRX; if the station is shared, alternate with the dumbbell version.</div>`
      : "";
    const setsHint = item.phaseKind === "work"
      ? `<span class="sets-hint">(2 sets in weeks 1–4)</span>`
      : "";
    const metaHtml = item.prescription
      ? `<strong>${item.prescription}</strong><span>Per round</span>`
      : `<strong>${item.sets} × ${exercise.reps ?? (slotData ? slotData.reps : "")}</strong><span>Sets × Reps</span>${setsHint}`;

    const RAMP_TYPES = ["dumbbell", "barbell", "machine", "cable"];
    const rampHint = item.rampSlot && RAMP_TYPES.includes(exercise.type)
      ? `<div class="ramp-hint">${exercise.startsAtZero ? "Once loaded: " : ""}Before your first set: ~50% × 8, then ~75% × 4 of your working weight.</div>`
      : "";
    const startLine = exercise.start
      ? `<div class="start-line">${/^\d/.test(exercise.start) ? "New to this? Start at " : ""}${exercise.start}</div>`
      : "";
    const trxLine = exercise.trx
      ? `<div class="start-line">${exercise.trx.hold
          ? "Hold; no levels."
          : `Level: start at 2 of 5 — ${exercise.trx.levels}`}</div>`
      : "";
    const ladderHtml = exercise.ladder
      ? `<div class="start-line">${exercise.rationale}</div>
         <details class="ladder"><summary>Pushup ladder</summary>
           <ul>${exercise.ladder.map(l =>
             `<li><strong>L${l.level}</strong> ${l.variation} — ${l.reps}${l.cue ? ` · ${l.cue}` : ""}</li>`).join("")}</ul>
         </details>`
      : "";

    const altButtons = [];
    if (item.alternatives && item.alternatives.length)
      altButtons.push(`<button class="alt-toggle opt" type="button" data-group="alternatives" aria-expanded="false">Options <span class="alt-badge">${item.alternatives.length}</span></button>`);
    if (item.trxAlternatives && item.trxAlternatives.length)
      altButtons.push(`<button class="alt-toggle trx" type="button" data-group="trxAlternatives" aria-expanded="false">TRX <span class="alt-badge">${item.trxAlternatives.length}</span></button>`);

    const card = document.createElement("div");
    card.className = "exercise-card" + (item.ssClass ? ` ${item.ssClass}` : "") + (done ? " done" : "");
    card.dataset.index = idx;
    card.innerHTML = `
      ${done ? `<div class="done-flag"><span></span>Done</div>` : ""}
      <div class="exercise-header">
        <div>
          <div class="exercise-title">${exercise.name}</div>
          <div class="phase-chip">
            ${item.chipText || item.phaseName}
          </div>
        </div>
        <div class="exercise-meta">
          ${metaHtml}
        </div>
      </div>

      <div class="gif-wrapper">
        ${imgTag(exercise.gifUrl, `${exercise.name} demonstration`)}
        <div class="gif-overlay"></div>
        <div class="gif-label"><span></span>Live form reference</div>
      </div>
      ${
        exercise.attribution && exercise.attribution.url
          ? `<div class="gif-attribution">
               Art credit: <a href="${exercise.attribution.url}" target="_blank" rel="noopener noreferrer">${exercise.attribution.label}</a>
             </div>`
          : ""
      }

      <div class="exercise-body">
        ${(exercise.notes || "") + supersetNote}
        ${rampHint}
        ${startLine}
        ${trxLine}
        ${trxPairTip}
        ${ladderHtml}
        ${exercise.tags && exercise.tags.length
          ? `<div class="tags">${exercise.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>`
          : ""}
        ${swapped
          ? `<div class="swap-note">Swapped from ${EXERCISES[slotData.exercise].name} · <button type="button" class="revert-btn">Revert</button></div>`
          : ""}
      </div>

      ${altButtons.length ? `<div class="alt-row">${altButtons.join("")}</div>` : ""}
      ${item.alternatives && item.alternatives.length
        ? `<div class="alt-panel" data-group="alternatives" hidden>${renderAlternativesPanel(item, currentId, "alternatives")}</div>` : ""}
      ${item.trxAlternatives && item.trxAlternatives.length
        ? `<div class="alt-panel" data-group="trxAlternatives" hidden>${renderAlternativesPanel(item, currentId, "trxAlternatives")}</div>` : ""}

      <div class="done-row">
        <label class="done-toggle">
          <input type="checkbox" class="done-checkbox" ${done ? "checked" : ""} />
          <span class="checkmark"></span>
          <span class="done-label-text">Mark this exercise as done</span>
        </label>
      </div>
    `;
    return card;
  }

  function renderTrack() {
    contentAreaEl.innerHTML = "";

    if (!currentSessionKey || !flatExercises.length) {
      renderRestCard();
      updateHeaderCompact();
      return;
    }

    const isRecovery = currentSessionKey === "M1" || currentSessionKey === "M2";
    if (isRecovery) {
      const roundBar = document.createElement("div");
      roundBar.className = "round-bar";
      roundBar.innerHTML = `
        <div class="round-toggle" role="group" aria-label="Recovery round">
          <button type="button" class="round-btn ${currentRound === 1 ? "active" : ""}" data-round="1">Round 1</button>
          <button type="button" class="round-btn ${currentRound === 2 ? "active" : ""}" data-round="2">Round 2</button>
        </div>
        <div class="equipment-note">You'll need: resistance band, mat, dowel/broomstick</div>`;
      contentAreaEl.appendChild(roundBar);
      roundBar.addEventListener("click", (e) => {
        const btn = e.target.closest(".round-btn");
        if (!btn) return;
        const round = Number(btn.dataset.round);
        if (round === currentRound) return;
        currentRound = round;
        currentSessionKey = `M${round}`;
        flatExercises = buildRecoveryExercises();
        renderTrack(); // keeps currentIndex
      });
    }

    const track = document.createElement("div");
    track.className = "track";
    flatExercises.forEach((item, idx) => track.appendChild(buildCard(item, idx)));
    contentAreaEl.appendChild(track);

    const bottomBar = document.createElement("div");
    bottomBar.className = "bottom-bar";
    bottomBar.innerHTML = `
      <div class="nav-buttons">
        <button class="btn" id="prevBtn" type="button" aria-label="Previous exercise">
          <span class="icon">⟵</span> Prev
        </button>
        <button class="btn btn-primary" id="nextBtn" type="button" aria-label="Next exercise">
          Next <span class="icon">⟶</span>
        </button>
      </div>
      <div class="status">
        <div class="dots" id="bottomDots">${renderDots()}</div>
        <div style="margin-top:3px;" id="bottomStatus"></div>
      </div>`;
    contentAreaEl.appendChild(bottomBar);

    wireTrack(track);
    bottomBar.querySelector("#prevBtn").addEventListener("click", () => goToExercise(currentIndex - 1));
    bottomBar.querySelector("#nextBtn").addEventListener("click", () => goToExercise(currentIndex + 1));
    bottomBar.querySelector("#bottomDots").addEventListener("click", (e) => {
      const dot = e.target.closest(".dot-indicator");
      if (dot) goToExercise(Number(dot.dataset.idx));
    });

    updateHeaderCompact();
    updateCarouselNav();
    // restore position to the same card without animation
    requestAnimationFrame(() => scrollToIndex(currentIndex, false));
  }

  function wireTrack(track) {
    let scrollRaf = null;
    track.addEventListener("scroll", () => {
      if (scrollRaf) return;
      scrollRaf = requestAnimationFrame(() => {
        scrollRaf = null;
        const idx = indexFromScroll(track);
        if (idx !== currentIndex) {
          currentIndex = idx;
          updateCarouselNav();
        }
      });
    }, { passive: true });

    track.addEventListener("click", (e) => {
      const card = e.target.closest(".exercise-card");
      if (!card) return;
      const idx = Number(card.dataset.index);
      const item = flatExercises[idx];

      const toggle = e.target.closest(".alt-toggle");
      if (toggle) {
        const group = toggle.dataset.group;
        const panel = card.querySelector(`.alt-panel[data-group="${group}"]`);
        const opening = panel && panel.hidden;
        // opening one panel closes the other (and resets button states)
        card.querySelectorAll(".alt-panel").forEach(p => p.hidden = true);
        card.querySelectorAll(".alt-toggle").forEach(t => {
          t.classList.remove("active");
          t.setAttribute("aria-expanded", "false");
        });
        if (opening) {
          panel.hidden = false;
          toggle.classList.add("active");
          toggle.setAttribute("aria-expanded", "true");
        }
        return;
      }

      const useBtn = e.target.closest(".alt-use");
      if (useBtn && !useBtn.disabled && item.slotData) {
        const newId = useBtn.dataset.exerciseId;
        setSwap(currentSessionKey, item.slotData.slot,
          newId === item.slotData.exercise ? null : newId);
        renderTrack(); // partner text + pairing tip live on other cards too
        return;
      }

      if (e.target.closest(".revert-btn") && item.slotData) {
        setSwap(currentSessionKey, item.slotData.slot, null);
        renderTrack();
      }
    });

    track.addEventListener("change", (e) => {
      const card = e.target.closest(".exercise-card");
      if (!card || !e.target.matches(".done-checkbox")) return;
      const idx = Number(card.dataset.index);
      const isDone = e.target.checked;
      setExerciseDone(idx, isDone); // writes its own card's index
      card.classList.toggle("done", isDone);
      let flag = card.querySelector(".done-flag");
      if (isDone && !flag) {
        flag = document.createElement("div");
        flag.className = "done-flag";
        flag.innerHTML = `<span></span>Done`;
        card.appendChild(flag);
      } else if (!isDone && flag) {
        flag.remove();
      }
    });
  }

  function indexFromScroll(track) {
    const center = track.scrollLeft + track.clientWidth / 2;
    let best = 0, bestDist = Infinity;
    Array.from(track.children).forEach((c, i) => {
      const cCenter = c.offsetLeft + c.offsetWidth / 2;
      const d = Math.abs(cCenter - center);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    return best;
  }

  function scrollToIndex(idx, smooth = true) {
    const track = contentAreaEl.querySelector(".track");
    if (!track || !track.children[idx]) return;
    const card = track.children[idx];
    const left = card.offsetLeft - (track.clientWidth - card.offsetWidth) / 2;
    track.scrollTo({ left, behavior: smooth ? "smooth" : "auto" });
  }

  function updateCarouselNav() {
    const total = flatExercises.length;
    const prevBtn = contentAreaEl.querySelector("#prevBtn");
    const nextBtn = contentAreaEl.querySelector("#nextBtn");
    const status = contentAreaEl.querySelector("#bottomStatus");
    if (prevBtn) prevBtn.disabled = currentIndex === 0;
    if (nextBtn) nextBtn.disabled = currentIndex === total - 1;
    if (status) status.textContent = `Exercise ${currentIndex + 1}/${total}`;
    document.querySelectorAll(".dot-indicator").forEach(d => {
      d.classList.toggle("active", Number(d.dataset.idx) === currentIndex);
    });
  }

  function goToExercise(idx) {
    if (idx < 0 || idx >= flatExercises.length) return;
    currentIndex = idx;
    updateCarouselNav();
    scrollToIndex(idx, true);
  }

  function loadDay(dayName) {
    currentDayName = dayName;
    currentSessionKey = DAY_PLAN[dayName] || null;
    currentIndex = 0;

    if (WORKOUTS[currentSessionKey]) {
      flatExercises = buildGymExercises(currentSessionKey);
    } else if (currentSessionKey === "M") {
      currentRound = 1;
      currentSessionKey = "M1";
      flatExercises = buildRecoveryExercises();
    } else {
      flatExercises = [];
    }

    Array.from(daySelectorEl.querySelectorAll(".day-pill")).forEach(btn => {
      btn.classList.toggle("active", btn.dataset.day === currentDayName);
    });

    renderTrack();
  }

  // === INIT =========================================================
  (function init() {
    const todayName = getTodayName();
    const startDay = DAY_PLAN.hasOwnProperty(todayName) ? todayName : "Monday";
    buildDaySelector(startDay);
    loadDay(startDay);

    // Theme: "system" | "light" | "dark", persisted in localStorage.
    const THEME_KEY = "strengthTheme";
    const themeBtn = document.getElementById("themeBtn");
    const ORDER = ["system", "light", "dark"];
    const ICONS = {
      system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>',
      light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
    };
    const mql = window.matchMedia("(prefers-color-scheme: dark)");
    function getPref() {
      let pref = "system";
      try { pref = localStorage.getItem(THEME_KEY) || "system"; } catch (e) {}
      return ORDER.includes(pref) ? pref : "system";
    }
    function applyTheme() {
      const pref = getPref();
      document.documentElement.dataset.theme =
        pref === "system" ? (mql.matches ? "dark" : "light") : pref;
      themeBtn.innerHTML = ICONS[pref];
      const label = `Theme: ${pref}. Tap to change.`;
      themeBtn.setAttribute("aria-label", label);
      themeBtn.title = label;
    }
    applyTheme();
    mql.addEventListener("change", applyTheme);
    themeBtn.addEventListener("click", () => {
      const next = ORDER[(ORDER.indexOf(getPref()) + 1) % ORDER.length];
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
      applyTheme();
    });
  })();
</script>
</body>
