version: 2
updates:
  # The Lambda's dependencies (the AWS SDK and esbuild) are the only runtime dependencies.
  - package-ecosystem: npm
    directory: /lambda/events
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
