<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Strength</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050816" />
  <!--
    Only this site, Cognito (us-west-2), the HTTP API, and the exercise GIF hosts used by the
    v0.2 viewer. No inline script or style, no third-party scripts. The API host is a wildcard
    because its id is only known after the first deploy; BUILD.md shows how to pin it.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://www.strengthlog.com https://recreation.truman.edu https://spotebi.com; connect-src 'self' https://cognito-idp.us-west-2.amazonaws.com https://*.execute-api.us-west-2.amazonaws.com; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Strength" />
  <link rel="stylesheet" href="css/app.css" />
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main class="page">
    <header class="top">
      <h1>Strength</h1>
      <p class="tag">Sync spike</p>
    </header>

    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>

    <section id="signin" class="card" aria-labelledby="signin-title" hidden>
      <h2 id="signin-title">Sign in</h2>
      <form id="signin-form" autocomplete="on" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required />
        <label for="password">PIN (6 digits)</label>
        <input id="password" name="password" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="current-password" required />
        <button id="signin-button" class="btn primary" type="submit">Sign in</button>
      </form>
    </section>

    <section id="app" class="card" aria-labelledby="app-title" hidden>
      <h2 id="app-title">Signed in</h2>
      <div class="actions">
        <button id="send-button" class="btn primary" type="button">Send test event</button>
        <button id="sync-button" class="btn" type="button">Sync</button>
        <button id="signout-button" class="btn quiet" type="button">Sign out</button>
      </div>

      <dl class="stats">
        <dt>Last round trip</dt>
        <dd id="rtt">none yet</dd>
        <dd id="rtt-hint" class="muted"></dd>
        <dt>Cursor</dt>
        <dd id="cursor" class="mono">none</dd>
        <dt>Events on this device</dt>
        <dd id="count">0</dd>
      </dl>

      <h3>Events</h3>
      <p id="empty" class="muted">No events yet. Send a test event, then Sync.</p>
      <ul id="events" class="events"></ul>
    </section>
  </main>
</body>
</html>
